<title>SRC Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one persistent blueprint sheet (left) beside a working panel (right): Explore, Plan by muscle, Splits.
   Single committed look: cyanotype blueprint, Carolina-blue accent, amber highlighter for the one selected thing. */
:root {
  color-scheme: dark;
  --paper: #0b2a4a; --paper-raised: #12365c; --paper-sunk: #082039;
  --grid-minor: #143a63; --grid-major: #1e4d80;
  --line: #8fb8e6; --wall: #e6f1ff; --ink: #eef5ff; --ink-muted: #9ebfe2;
  --accent: #7bafd4; --on-accent: #0b2a4a; --accent-wash: rgba(123,175,212,.34);
  --highlight: #ffb547; --on-highlight: #2a1a00; --highlight-wash: rgba(255,181,71,.34);
  --zone-fill: rgba(123,175,212,.07);
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r1: 2px; --pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
  --dim: .26;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 15px/22px var(--font-sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper-sunk); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--highlight); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.eyebrow { font: 500 11px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.code { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper-sunk); border-bottom: 1px solid var(--grid-major);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: var(--s3); margin-right: auto; min-width: 0; }
.brand b { font: 700 22px/26px var(--font-cond); letter-spacing: .01em; }
.brand span { font: 400 11px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r1); overflow: hidden; }
.tabs a { font: 600 13px/18px var(--font-sans); padding: 7px 14px; color: var(--ink); text-decoration: none; }
.tabs a + a { border-left: 1px solid var(--line); }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.tabs a:focus-visible { outline-offset: -3px; }

/* Main grid */
.main { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s5);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--s4) var(--s6); }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Sheet */
.sheet { min-width: 0; }
.sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s2); }
.floors { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r1); overflow: hidden; }
.floors button { font: 600 13px/18px var(--font-sans); padding: 6px 14px; background: transparent; border: 0; cursor: pointer; }
.floors button + button { border-left: 1px solid var(--line); }
.floors button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.floors button[aria-selected="true"] .code { color: var(--on-accent); }
.floors button:focus-visible { outline-offset: -3px; }
.legend { display: flex; gap: var(--s3); flex-wrap: wrap; margin-left: auto; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 6px; font: 400 12px/16px var(--font-mono); color: var(--ink-muted); }
.key i { width: 12px; height: 12px; border: 1px solid var(--line); background: var(--paper-raised); border-radius: var(--r1); }
.key i.k-match { background: var(--accent-wash); border-color: var(--accent); }
.key i.k-sel { background: var(--highlight-wash); border-color: var(--highlight); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--font-mono); color: var(--ink-muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); margin: 0; }

.plan-scroll { border: 1px solid var(--grid-major); overflow: auto; max-height: calc(100dvh - 150px); -webkit-overflow-scrolling: touch; }
.plan { position: relative; background: var(--paper); }
.plan svg { display: block; width: 100%; height: auto; max-height: calc(100dvh - 152px); min-height: 240px; }
.plan-scroll.zoomed .plan svg { max-height: none; }
.zoom { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r1); overflow: hidden; }
.zoom button { background: transparent; border: 0; cursor: pointer; font: 500 13px/18px var(--font-mono); padding: 6px 10px; min-width: 36px; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button:disabled { opacity: .4; cursor: default; }
.zoom button:focus-visible { outline-offset: -3px; }
.plan svg * { vector-effect: non-scaling-stroke; }
.g-minor { stroke: var(--grid-minor); stroke-width: 1; }
.g-major { stroke: var(--grid-major); stroke-width: 1; }
.wall { fill: none; stroke: var(--wall); stroke-width: 4; stroke-linejoin: miter; }
.zone { fill: var(--zone-fill); stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 4; opacity: .7; }
.zone-label { font-family: var(--font-mono); font-size: calc(11px * var(--k, 1)); letter-spacing: .08em; fill: var(--ink-muted); }
.dim-t { font-family: var(--font-mono); font-size: calc(10px * var(--k, 1)); letter-spacing: .04em; fill: var(--ink-muted); }
.dimline { stroke: var(--ink-muted); stroke-width: 1; fill: none; }
.tblock { fill: var(--paper-sunk); stroke: var(--line); stroke-width: 1; }
.tflag { fill: var(--highlight); }

/* Machine outlines (top-down) */
.mk { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .14s ease-out, opacity .14s; outline: none; }
.mk .hit { fill: transparent; stroke: none; }
.mk .pad { fill: none; stroke: transparent; stroke-width: 1; stroke-dasharray: 3 3; }
.mk .b { fill: var(--paper-raised); stroke: var(--line); stroke-width: 1; }
.mk .d { fill: none; stroke: var(--line); stroke-width: 1; }
.mk .bar { fill: none; stroke: var(--wall); stroke-width: 2; stroke-linecap: round; }
.mk .s { fill: var(--line); stroke: none; }
.mk .f { fill: none; stroke: var(--grid-major); stroke-width: 1; }
.mk .lbl { font-family: var(--font-mono); font-size: calc(11px * var(--k, 1)); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.mk:hover, .mk.is-hover, .mk:focus-visible { transform: scale(1.1); }
.mk:hover .pad, .mk.is-hover .pad, .mk:focus-visible .pad { stroke: var(--highlight); }
.mk.is-match .b { fill: var(--accent-wash); stroke: var(--accent); }
.mk.is-match .d, .mk.is-match .f { stroke: var(--accent); }
.mk.is-match .s { fill: var(--accent); }
.mk.is-active .b { fill: var(--highlight-wash); stroke: var(--highlight); }
.mk.is-active .d, .mk.is-active .f { stroke: var(--highlight); }
.mk.is-active .s { fill: var(--highlight); }
.mk.is-active .bar { stroke: var(--highlight); }
.mk.is-active .pad { stroke: var(--highlight); }
.mk.is-dim { opacity: var(--dim); }
@media (prefers-reduced-motion: reduce) { .mk { transition: none; } .mk:hover, .mk.is-hover, .mk:focus-visible { transform: none; } }

.tip { position: absolute; z-index: 3; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; background: var(--paper-raised); border: 1px solid var(--highlight); border-radius: var(--r1); padding: 8px 12px; width: max-content; max-width: 260px; }
.tip.below { transform: translate(-50%, 10px); }
.tip-name { font-weight: 600; font-size: 14px; line-height: 18px; }
.tip-mus { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin-top: 2px; }
.tip-vid { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: 500 11px/14px var(--font-mono); color: var(--highlight); }
.tri { width: 0; height: 0; border-left: 7px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; flex: none; }

/* Panel */
.panel { min-width: 0; display: flex; flex-direction: column; gap: var(--s4); align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100dvh - 90px); overflow: auto; padding-bottom: var(--s4); }
@media (max-width: 960px) { .panel { position: static; max-height: none; overflow: visible; } }
.box { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--r1); padding: var(--s4); }
.h1 { font: 700 30px/34px var(--font-cond); margin: 4px 0 var(--s2); text-wrap: balance; }
.h2 { font: 600 22px/28px var(--font-sans); margin: 4px 0 var(--s3); text-wrap: balance; }
.lede { margin: 0; color: var(--ink-muted); font-size: 14px; line-height: 20px; }

.btn { font: 600 14px/20px var(--font-sans); padding: 8px 14px; border-radius: var(--r1); border: 1px solid var(--line); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--paper-sunk); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: default; }
.link { font: 500 12px/16px var(--font-mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.x { width: 28px; height: 28px; border: 1px solid var(--line); background: transparent; border-radius: var(--r1); cursor: pointer; font: 500 16px/1 var(--font-mono); flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; font: 400 13px/18px var(--font-sans); padding: 4px 12px; border-radius: var(--pill); border: 1px solid var(--line); background: transparent; }
button.chip { cursor: pointer; }
.chip.sec { border-style: dashed; color: var(--ink-muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* Search */
.search { display: flex; align-items: center; gap: 8px; background: var(--paper-sunk); border: 1px solid var(--line); border-radius: var(--r1); padding: 0 10px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: 400 15px/22px var(--font-sans); padding: 9px 0; outline: none; }
.search input::placeholder { color: var(--ink-muted); }
.search:focus-within { outline: 1.5px solid var(--highlight); outline-offset: 2px; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid-major); }
.row:last-child { border-bottom: 0; }
.row-btn { all: unset; display: contents; cursor: pointer; }
.row-name { font-weight: 600; line-height: 20px; }
.row-meta { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.row-sets { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.is-sel .row-name { color: var(--highlight); }
.row-click { cursor: pointer; }
.row-click:hover .row-name { text-decoration: underline; text-underline-offset: 3px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: var(--s4) 0 2px; }
.group-h:first-child { margin-top: 0; }

/* Machine card */
.card-head { display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; }
.count { font: 500 16px var(--font-mono); color: var(--ink-muted); }
.sub { margin: var(--s3) 0 6px; }
.cues { margin: 0; padding-left: 20px; font-size: 14px; line-height: 20px; }
.cues li + li { margin-top: 6px; }
.note { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin: var(--s2) 0 0; }
.vid { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--s3); align-items: center; margin-top: var(--s4); padding: var(--s3); background: var(--paper-sunk); border: 1px solid var(--line); border-radius: var(--r1); color: var(--ink); text-decoration: none; }
a.vid:hover { border-color: var(--highlight); }
a.vid:hover .vframe { border-color: var(--highlight); color: var(--highlight); }
.vframe { aspect-ratio: 9 / 16; max-width: 100%; border: 1px dashed var(--line); border-radius: var(--r1); display: grid; place-items: center; color: var(--ink-muted); background: repeating-linear-gradient(0deg, transparent 0 11px, var(--grid-minor) 11px 12px), repeating-linear-gradient(90deg, transparent 0 11px, var(--grid-minor) 11px 12px); }
.vframe .tri { border-left-width: 16px; border-top-width: 10px; border-bottom-width: 10px; }
.vtitle { font-weight: 600; font-size: 14px; line-height: 19px; overflow-wrap: anywhere; }
.vch { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin-top: 2px; }
.vgo { font: 500 12px/16px var(--font-mono); color: var(--accent); margin-top: 8px; }
.flag { display: inline-block; font: 500 10px/14px var(--font-mono); letter-spacing: .06em; background: var(--highlight); color: var(--on-highlight); padding: 1px 6px; border-radius: var(--r1); }
.also { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: var(--s3); align-items: baseline; }

/* Splits */
.splits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s2); }
.split { text-align: left; background: var(--paper-sunk); border: 1px solid var(--grid-major); border-radius: var(--r1); padding: 10px 12px; cursor: pointer; }
.split:hover { border-color: var(--line); }
.split[aria-pressed="true"] { border-color: var(--highlight); background: var(--paper); }
.split b { display: block; font: 600 15px/20px var(--font-sans); margin-top: 2px; }
.days { display: flex; flex-wrap: wrap; gap: 6px; margin: var(--s3) 0 var(--s2); }
.day { font: 600 13px/18px var(--font-sans); padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--r1); background: transparent; cursor: pointer; }
.day .code { margin-right: 6px; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] .code { color: var(--on-accent); }
/* Busy hours */
.busy-days { display: grid; grid-template-columns: repeat(7, 1fr); margin: var(--s2) 0 var(--s3); border-bottom: 1px solid var(--grid-major); }
.busy-day { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 6px 0; cursor: pointer; font: 500 12px/16px var(--font-mono); letter-spacing: .04em; color: var(--ink-muted); }
.busy-day[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.busy-day:focus-visible { outline-offset: -3px; }
.busy-now { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; min-height: 20px; margin-bottom: var(--s2); }
.busy-now .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--highlight); flex: none; }
.busy-now b { color: var(--highlight); font-weight: 600; }
.bars { position: relative; display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); gap: 3px; align-items: end; height: 112px; border-bottom: 1px solid var(--line);
  background: linear-gradient(var(--grid-major), var(--grid-major)) 0 33.3% / 100% 1px no-repeat, linear-gradient(var(--grid-major), var(--grid-major)) 0 66.6% / 100% 1px no-repeat; }
.bar { border: 0; padding: 0; background: var(--line); opacity: .5; border-radius: 3px 3px 0 0; cursor: pointer; min-height: 4px; }
.bar:hover, .bar.is-pick { opacity: 1; }
.bar.is-now { background: var(--highlight); opacity: 1; }
.bar:focus-visible { outline-offset: 1px; }
.bars-x { display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); gap: 3px; margin-top: 4px; font: 400 11px/14px var(--font-mono); color: var(--ink-muted); }
.bars-x span { white-space: nowrap; }
.busy-pick { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin-top: var(--s2); min-height: 18px; }
.busy-pick b { color: var(--ink); font-weight: 600; }

/* Phones and small tablets */
@media (max-width: 960px) {
  .sheet-card { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 62dvh; overflow: auto; border-radius: 10px 10px 0 0; border-bottom: 0;
    padding-top: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-shadow: 0 -10px 28px rgba(2, 12, 26, .55); }
  .sheet-card::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); opacity: .5; margin: 0 auto 10px; }
  .main.has-sheet { padding-bottom: 64dvh; }
}
@media (max-width: 640px) {
  .brand span { display: none; }
  .tabs { width: 100%; display: flex; }
  .tabs a { flex: 1; text-align: center; padding: 9px 4px; }
  .h1 { font-size: 26px; line-height: 30px; }
  .legend { margin-left: 0; }
  .sheet-bar { gap: 8px; }
  .plan-scroll { max-height: 58dvh; }
  .row { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; }
  .vid { grid-template-columns: 72px minmax(0, 1fr); }
}
@media (hover: none) { .tip { display: none; } .mk:hover { transform: none; } }

.foot { font: 400 11px/16px var(--font-mono); letter-spacing: .03em; color: var(--ink-muted); }
</style>

  function changeFloor(fl) { setFloor(fl); setZoom(zoomFor(fl)); }

  useEffect(function () { function on() { setTab(readHash()); setSelected(null); } window.addEventListener('hashchange', on); return function () { window.removeEventListener('hashchange', on); }; }, []);
  useEffect(function () { save('muscles', muscles); }, [muscles]);
  useEffect(function () { save('split', split); }, [split]);
  useEffect(function () { save('codes', codes); }, [codes]);

  function select(id, vk) { var m = byId(id); if (!m) return; setSelected(id); setVkey(vk || null); if (m.floor !== floor) changeFloor(m.floor); }
  function setSplit(id) { setSplitS(id); setDay(0); }

  var highlight = null;
  if (tab === 'planner' && muscles.length) highlight = machinesFor(muscles).map(function (m) { return m.id; });
  if (tab === 'splits') { var s = SPLITS.filter(function (x) { return x.id === split; })[0] || SPLITS[0]; highlight = (s.days[day] || s.days[0]).ex.map(function (e) { return e.station; }); }
  if (tab === 'explore' && query.trim()) { var q = query.trim().toLowerCase(); highlight = MACHINES.filter(function (m) { return (m.name + ' ' + m.id + ' ' + m.primary.join(' ') + ' ' + m.secondary.join(' ')).toLowerCase().indexOf(q) >= 0; }).map(function (m) { return m.id; }); }
  var other = highlight ? highlight.filter(function (id) { var m = byId(id); return m && m.floor !== floor; }).length : 0;

  return h(Fragment, null,
    ReactDOM.createPortal(h(Header, { tab: tab }), document.getElementById('hdr')),
    h('main', { className: cx('main', selected && 'has-sheet') },
      h('section', { className: 'sheet', 'aria-label': 'Floor plan' },
        h('div', { className: 'sheet-bar' },
          h('div', { className: 'floors', role: 'tablist', 'aria-label': 'Floor' }, FLOORS.map(function (f) {
            return h('button', { key: f.id, type: 'button', role: 'tab', 'aria-selected': floor === f.id ? 'true' : 'false', onClick: function () { changeFloor(f.id); } },
              h('span', { className: 'code' }, 'L' + f.id), ' ', f.name);
          })),
          other ? h('button', { type: 'button', className: 'link', onClick: function () { changeFloor(floor === '1' ? '2' : '1'); } }, other + ' more on ' + (floor === '1' ? 'Floor 2' : 'Floor 1') + ' →') : null,
          h('div', { className: 'legend' },
            h('span', { className: 'key' }, h('i', { className: 'k-sel' }), 'Selected'),
            highlight ? h('span', { className: 'key' }, h('i', { className: 'k-match' }), tab === 'splits' ? 'Today' : 'Match') : null,
            h('label', { className: 'toggle' }, h('input', { id: 'codes', type: 'checkbox', checked: codes, onChange: function (e) { setCodes(e.target.checked); } }), 'Codes'),
            h('div', { className: 'zoom', role: 'group', 'aria-label': 'Zoom' },
              h('button', { type: 'button', 'aria-label': 'Zoom out', disabled: zoom <= 1, onClick: function () { setZoom(Math.max(1, +(zoom - .5).toFixed(2))); } }, '−'),
              h('button', { type: 'button', 'aria-label': 'Reset zoom', onClick: function () { setZoom(1); } }, Math.round(zoom * 100) + '%'),
              h('button', { type: 'button', 'aria-label': 'Zoom in', disabled: zoom >= 3, onClick: function () { setZoom(Math.min(3, +(zoom + .5).toFixed(2))); } }, '+')))
        ),
        h(Plan, { floor: floor, zoom: zoom, selected: selected, highlight: highlight, codes: codes, onSelect: function (id) { select(id); } }),
        h('p', { className: 'foot' }, 'Machines drawn from above, positions traced by hand from SRC sheets E1/E2 and approximate. Grouped stations show every unit in the group. Zoom in and drag to pan on small screens.')
      ),
      h('aside', { className: 'panel', 'aria-label': 'Details' },
        selected ? h(MachineCard, { id: selected, vkey: vkey, onClose: function () { setSelected(null); }, onSelect: function (id) { select(id); } }) : null,
        tab === 'explore' ? h(Explore, { floor: floor, query: query, setQuery: setQuery, selected: selected, onSelect: select }) : null,
        tab === 'planner' ? h(Planner, { muscles: muscles, setMuscles: setMuscles, selected: selected, onSelect: select }) : null,
        tab === 'splits' ? h(Splits, { split: split, setSplit: setSplit, day: day, setDay: setDay, selected: selected, onSelect: select }) : null
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
